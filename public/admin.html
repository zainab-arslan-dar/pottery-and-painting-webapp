<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Studio admin</title>
<link rel="stylesheet" href="/style.css"></head>
<body><main class="adm">
<h1>Studio</h1>
<form id="login"><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn">Log in</button></form>
<section id="panel" hidden>
  <h2>Add a piece</h2>
  <form id="add">
    <label>Title<input name="title" required maxlength="120"></label>
    <label>Category<select name="category"><option>Vases</option><option>Canvases</option><option>Other</option></select></label>
    <label>Price (AED)<input name="price" type="number" min="0" step="0.01" required></label>
    <label>Description<textarea name="description" maxlength="1500" rows="3"></textarea></label>
    <label>Photo<input name="photo" type="file" accept="image/*"></label>
    <button class="btn">Publish piece</button>
  </form>
  <h2>Pieces</h2><div id="plist"></div>
  <h2>Inquiries</h2><div id="ilist"></div>
</section>
<p id="amsg" role="status"></p>
<p><a href="/">Back to shop</a></p>
</main><script src="/admin.js" defer></script></body></html>
